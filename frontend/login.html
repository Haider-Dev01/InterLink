
<!DOCTYPE html>
<html class="light scroll-smooth" lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Connexion | InternLink Nexus</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        ::selection {
            background: #00288e;
            color: white;
        }

        /* Animation de fond fluide */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #f7f9fb, #e0e7ff, #f0f4ff, #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Effet Wow Entrée */
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .reveal-card { animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Glassmorphism */
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .glass-effect:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        /* Toggle Slider Logic */
        .user-type-toggle input:checked ~ .slider { transform: translateX(100%); }
        input:focus {
            box-shadow: 0 0 0 4px rgba(0, 40, 142, 0.15),
                        0 10px 30px rgba(0, 40, 142, 0.1);
        }
    </style>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00288e",
                        "secondary": "#4648d4",
                        "surface": "#f7f9fb",
                        "on-surface": "#191c1e",
                        "on-surface-variant": "#444653"
                    },
                    borderRadius: {
                        'bento': '1.5rem',
                    }
                }
            }
        }
    </script>
</head>
<body class="animated-bg min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Floating Particles -->
    <div class="particle" id="p1" style="width:12px;height:12px;background:#dde1ff;top:15%;left:8%;position:fixed;border-radius:50%;pointer-events:none;will-change:transform;z-index:5;"></div>
    <div class="particle" id="p2" style="width:8px;height:8px;background:#e1e0ff;top:60%;left:92%;position:fixed;border-radius:50%;pointer-events:none;will-change:transform;z-index:5;"></div>
    <div class="particle" id="p3" style="width:16px;height:16px;background:#6ffbbe;opacity:0.5;top:80%;left:20%;position:fixed;border-radius:50%;pointer-events:none;will-change:transform;z-index:5;"></div>
    <div class="particle" id="p4" style="width:6px;height:6px;background:#4648d4;opacity:0.3;top:30%;left:85%;position:fixed;border-radius:50%;pointer-events:none;will-change:transform;z-index:5;"></div>

    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px] animate-pulse pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/10 rounded-full blur-[120px] animate-pulse pointer-events-none" style="animation-delay: 2s;"></div>

    <div class="w-full max-w-[480px] z-10">
        
        <div class="text-center mb-8 reveal-card" style="animation-delay: 0.1s;">
            <div class="flex items-center justify-center gap-3 mb-2">
                <span class="material-symbols-outlined text-primary text-4xl" data-icon="hub">hub</span>
                <span class="text-3xl font-black text-primary tracking-tight">InternLink</span>
            </div>
            <p class="text-on-surface-variant font-medium">Connectez-vous au futur du recrutement IA</p>
        </div>

        <div class="glass-effect rounded-[2.5rem] p-8 md:p-10 shadow-2xl shadow-primary/10 reveal-card" style="animation-delay: 0.2s;">
            
            <div class="relative flex bg-surface p-1 rounded-2xl mb-8 user-type-toggle border border-surface-variant/50">
                <button id="tab-student" type="button" onclick="switchUser('student')" class="relative z-10 flex-1 flex items-center justify-center gap-2 py-3 text-sm font-bold text-primary transition-colors duration-300">
                    <span class="material-symbols-outlined text-[18px]">school</span>
                    Étudiant
                </button>
                <button id="tab-recruiter" type="button" onclick="switchUser('recruiter')" class="relative z-10 flex-1 flex items-center justify-center gap-2 py-3 text-sm font-bold text-on-surface-variant transition-colors duration-300">
                    <span class="material-symbols-outlined text-[18px]">business_center</span>
                    Recruteur
                </button>
                <div id="user-slider" class="absolute top-1 left-1 w-[calc(50%-4px)] h-[calc(100%-8px)] bg-white rounded-xl shadow-sm transition-transform duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)]"></div>
            </div>

            <form action="#" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-xs font-black uppercase tracking-widest text-on-surface-variant ml-1">Adresse Email</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
                        <input type="email" placeholder="nom@exemple.com" class="w-full pl-12 pr-4 py-4 bg-white/50 border border-surface-variant rounded-2xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all font-medium placeholder:text-on-surface-variant/40" required>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-black uppercase tracking-widest text-on-surface-variant ml-1">Mot de passe</label>
                        <a href="#" class="text-[11px] font-bold text-primary hover:underline">Oublié ?</a>
                    </div>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
                        <input type="password" placeholder="••••••••" class="w-full pl-12 pr-4 py-4 bg-white/50 border border-surface-variant rounded-2xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all font-medium placeholder:text-on-surface-variant/40" required>
                        <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-2 ml-1">
                    <input type="checkbox" id="remember" class="w-5 h-5 border-surface-variant rounded-lg text-primary focus:ring-primary">
                    <label for="remember" class="text-sm font-medium text-on-surface-variant select-none">Rester connecté</label>
                </div>

                <button type="submit" class="w-full bg-primary text-white font-black py-4 rounded-2xl shadow-xl shadow-primary/20 hover:shadow-2xl hover:bg-primary-container hover:-translate-y-1 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 group">
                    <span>Accéder au Nexus</span>
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </button>
            </form>

            <div class="mt-10">
                <div class="relative flex items-center justify-center mb-8">
                    <div class="absolute w-full border-t border-surface-variant/50"></div>
                    <span class="relative bg-white px-4 text-[10px] font-black uppercase tracking-[0.2em] text-on-surface-variant/60">Ou continuer avec</span>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button type="button" class="relative flex items-center justify-center gap-3 py-3 bg-white/50 border border-surface-variant rounded-2xl hover:bg-surface hover:border-primary hover:shadow-lg hover:-translate-y-1 transition-all font-bold text-sm shadow-sm group">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5 group-hover:scale-110 transition-transform" alt="Google">
                        <span>Google</span>
                    </button>
                    <button type="button" class="relative flex items-center justify-center gap-3 py-3 bg-white/50 border border-surface-variant rounded-2xl hover:bg-surface hover:border-primary hover:shadow-lg hover:-translate-y-1 transition-all font-bold text-sm shadow-sm group">
                        <img src="https://www.svgrepo.com/show/512317/github-142.svg" class="w-5 h-5 group-hover:scale-110 transition-transform" alt="Github">
                        <span>Github</span>
                    </button>
                </div>
            </div>
        </div>

        <p class="text-center mt-8 reveal-card" style="animation-delay: 0.3s;">
            <span class="text-on-surface-variant font-medium text-sm">Pas encore de compte ?</span>
            <a href="inscription.html" class="text-primary font-black text-sm hover:underline ml-1">Rejoignez-nous gratuitement</a>
        </p>
    </div>

    <script>
        /* =========================================
           PAGE LOAD ANIMATION
        ========================================= */
        const tl = gsap.timeline();
        tl.from(".reveal-card", {
            y: 40,
            opacity: 0,
            duration: 0.8,
            stagger: 0.15,
            ease: "power3.out"
        });

        /* =========================================
           FLOATING PARTICLES
        ========================================= */
        ['#p1','#p2','#p3','#p4'].forEach((id, i) => {
            gsap.to(id, {
                y: gsap.utils.random(-30, 30),
                x: gsap.utils.random(-20, 20),
                duration: gsap.utils.random(3, 5),
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: i * 0.5
            });
        });

        /* =========================================
           PASSWORD VISIBILITY TOGGLE
        ========================================= */
        document.querySelectorAll("button[type='button']").forEach(btn => {
            const visibilityIcon = btn.querySelector('.material-symbols-outlined[style*="20px"]');
            if (visibilityIcon && btn.parentElement.querySelector('input[type="password"]')) {
                const passwordInput = btn.parentElement.querySelector('input');
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const type = passwordInput.type === 'password' ? 'text' : 'password';
                    passwordInput.type = type;
                    
                    gsap.to(btn, {
                        scale: 1.2,
                        duration: 0.2,
                        yoyo: true,
                        repeat: 1
                    });
                });
            }
        });

        /* =========================================
           USER TYPE SWITCHING
        ========================================= */
        function switchUser(type) {
            const slider = document.getElementById('user-slider');
            const btnStudent = document.getElementById('tab-student');
            const btnRecruiter = document.getElementById('tab-recruiter');

            if (type === 'student') {
                gsap.to(slider, { x: 0, duration: 0.5, ease: 'elastic.out(1, 0.6)' });
                btnStudent.classList.replace('text-on-surface-variant', 'text-primary');
                btnRecruiter.classList.replace('text-primary', 'text-on-surface-variant');
            } else {
                gsap.to(slider, { x: '100%', duration: 0.5, ease: 'elastic.out(1, 0.6)' });
                btnRecruiter.classList.replace('text-on-surface-variant', 'text-primary');
                btnStudent.classList.replace('text-primary', 'text-on-surface-variant');
            }
        }

        /* =========================================
           BUTTON RIPPLE EFFECT & HOVER
        ========================================= */
        document.querySelectorAll("button").forEach(btn => {
            btn.addEventListener("click", function(e) {
                if (!e.target.closest('input')) {
                    const ripple = document.createElement("span");
                    ripple.classList.add("ripple");
                    this.appendChild(ripple);

                    const x = e.clientX - this.offsetLeft;
                    const y = e.clientY - this.offsetTop;

                    ripple.style.left = x + "px";
                    ripple.style.top = y + "px";

                    setTimeout(() => ripple.remove(), 600);
                }
            });

            btn.addEventListener("mouseenter", function() {
                if (this.id !== 'tab-student' && this.id !== 'tab-recruiter') {
                    gsap.to(this, { scale: 1.02, duration: 0.2 });
                }
            });

            btn.addEventListener("mouseleave", function() {
                if (this.id !== 'tab-student' && this.id !== 'tab-recruiter') {
                    gsap.to(this, { scale: 1, duration: 0.2 });
                }
            });
        });
    </script>

</body>
</html>
